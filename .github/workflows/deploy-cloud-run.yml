name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write  # 키 파일 없이 GCP에 인증(Workload Identity)하기 위해 필요

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

env:
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'hscredit' }}
  REGION: ${{ vars.CLOUD_RUN_REGION || 'asia-northeast3' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # python -m 으로 실행해야 저장소 루트가 sys.path에 들어가 app/optimize_student_sections를 import할 수 있음
        run: python -m pytest -q tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tools/setup_gcp_deploy.sh 가 아래 변수들을 등록함 (비밀값 아님, 키 파일 불필요)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Deploy (build from Dockerfile)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          source: .
          # README "서버 배포 시 성능 설정" 참고: 요청 사이에도 CPU를 유지해야 솔버 품질이 유지됨.
          # 공개 웹앱이므로 누구나 접속 가능하게 설정 (로그인 없이 사용하는 서비스).
          # 작업 상태(JOBS)가 프로세스 메모리에 있으므로 인스턴스는 반드시 1개여야 함.
          # 2개 이상이면 /status 폴링이 다른 인스턴스로 가서 작업을 찾지 못함.
          flags: >-
            --allow-unauthenticated
            --no-cpu-throttling
            --cpu=4
            --memory=2Gi
            --timeout=300
            --min-instances=0
            --max-instances=1
            --concurrency=20
          env_vars: |
            SOLVER_TIME_LIMIT=240
            MAX_CONCURRENT_JOBS=1

      - name: Show service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
